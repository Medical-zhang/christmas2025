<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣诞快乐 - ZQN 专属回忆版</title>
    <link rel="apple-touch-icon" href="./1.jpg">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 90%);
            font-family: 'Arial', sans-serif;
        }

        #memory-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; 
            pointer-events: none;
            overflow: hidden;
        }

        .memory-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            mix-blend-mode: screen; 
            transition: opacity 2s ease-in-out, transform 8s linear;
        }

        .memory-slide.active {
            opacity: 0.4; 
            transform: scale(1.05);
        }

        .slide-bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) contrast(1.2);
            opacity: 0.6; 
        }

        .slide-main-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            z-index: 2;
        }

        canvas {
            position: relative;
            z-index: 10;
            display: block;
        }

        .title-box {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }
        h1 {
            color: #fff;
            font-size: 3rem;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin: 0;
            letter-spacing: 5px;
            font-weight: 100;
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
        }
        p {
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            margin-top: 10px;
            letter-spacing: 3px;
            opacity: 0;
            animation: fadeIn 2s forwards 1.5s;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="memory-container"></div>

    <div class="title-box">
        <h1>MERRY CHRISTMAS TO ZQN</h1>
        <p>Precious Memories</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const memoryImages = [
            "./1.jpg",
            "./2.jpg",
            "./3.jpg",
            "./4.jpg",
            "./5.jpg",
            "./6.jpg",
            "./7.jpg",
            "./8.jpg",
            "./9.jpg"
        ];

        const container = document.getElementById('memory-container');
        let currentImgIndex = 0;

        memoryImages.forEach((url) => {
            const slideDiv = document.createElement('div');
            slideDiv.classList.add('memory-slide');

            const bgDiv = document.createElement('div');
            bgDiv.classList.add('slide-bg-blur');
            bgDiv.style.backgroundImage = `url('${url}')`;

            const imgDiv = document.createElement('div');
            imgDiv.classList.add('slide-main-img');
            imgDiv.style.backgroundImage = `url('${url}')`;

            slideDiv.appendChild(bgDiv);
            slideDiv.appendChild(imgDiv);
            container.appendChild(slideDiv);
        });

        const slides = document.querySelectorAll('.memory-slide');

        function playSlideshow() {
            if (slides.length === 0) return;

            slides.forEach(slide => {
                slide.classList.remove('active');
                slide.style.transform = 'scale(1)';
            });

            slides[currentImgIndex].classList.add('active');

            currentImgIndex = (currentImgIndex + 1) % slides.length;

            setTimeout(playSlideshow, 6000); 
        }
        
        playSlideshow();


        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 70);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createGlowTexture();

        const treeGroup = new THREE.Group();

        const innerGeo = new THREE.BufferGeometry();
        const innerPos = [];
        for(let i=0; i<8000; i++) {
            const h = Math.random() * 50; 
            const maxR = 18 * (1 - h / 50); 
            const r = Math.random() * maxR; 
            const a = Math.random() * Math.PI * 2;
            innerPos.push(Math.cos(a)*r, h - 25, Math.sin(a)*r);
        }
        innerGeo.setAttribute('position', new THREE.Float32BufferAttribute(innerPos, 3));
        const innerMat = new THREE.PointsMaterial({ size: 0.5, color: 0x0f3d0f, transparent: true, opacity: 0.8 });
        treeGroup.add(new THREE.Points(innerGeo, innerMat));

        const outerGeo = new THREE.BufferGeometry();
        const outerPos = [], outerColors = [], outerSizes = [];
        const c1=new THREE.Color(0xff3333), c2=new THREE.Color(0xffaa00), c3=new THREE.Color(0x22aaff), c4=new THREE.Color(0xffffff);
        
        for(let i=0; i<3500; i++) {
            let x,y,z,c,s;
            if (Math.random() > 0.6) {
                const p = i/3500, h = p*50, ang = p*40, r = 19*(1-h/50);
                x=Math.cos(ang)*r; y=h-25; z=Math.sin(ang)*r; c=c2; s=1.2;
            } else {
                const h=Math.random()*50, r=18.5*(1-h/50), a=Math.random()*Math.PI*2;
                x=Math.cos(a)*r; y=h-25; z=Math.sin(a)*r;
                const rand=Math.random(); c=rand>0.7?c1:rand>0.4?c3:c4; s=1.5+Math.random();
            }
            outerPos.push(x,y,z); outerColors.push(c.r,c.g,c.b); outerSizes.push(s);
        }
        outerGeo.setAttribute('position', new THREE.Float32BufferAttribute(outerPos, 3));
        outerGeo.setAttribute('color', new THREE.Float32BufferAttribute(outerColors, 3));
        outerGeo.setAttribute('size', new THREE.Float32BufferAttribute(outerSizes, 1));
        
        const outerMat = new THREE.PointsMaterial({ 
            map: particleTexture, 
            vertexColors: true, 
            transparent: true, 
            blending: THREE.AdditiveBlending,
            depthWrite: false 
        });
        treeGroup.add(new THREE.Points(outerGeo, outerMat));

        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 26, 0], 3));
        const starMat = new THREE.PointsMaterial({ size: 25, color: 0xffffaa, map: particleTexture, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
        treeGroup.add(new THREE.Points(starGeo, starMat));
        
        scene.add(treeGroup);

        const reflection = treeGroup.clone();
        reflection.scale.y = -1;
        reflection.position.y = -50;
        reflection.traverse(c => { 
            if(c.isPoints) { 
                c.material = c.material.clone(); 
                c.material.opacity = 0.15; 
            } 
        });
        scene.add(reflection);

        const snowGeo = new THREE.BufferGeometry();
        const snowPos = [], snowVel = [];
        for(let i=0; i<1500; i++) {
            snowPos.push((Math.random()-0.5)*150, (Math.random()-0.5)*100, (Math.random()-0.5)*150);
            snowVel.push(Math.random()*0.1+0.05);
        }
        snowGeo.setAttribute('position', new THREE.Float32BufferAttribute(snowPos, 3));
        const snowSystem = new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: 0.6, color: 0xffffff, map: particleTexture, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
        scene.add(snowSystem);

        let mouseX=0, mouseY=0;
        document.addEventListener('mousemove', e => { 
            mouseX=(e.clientX-window.innerWidth/2)*0.05; 
            mouseY=(e.clientY-window.innerHeight/2)*0.05; 
        });
        
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            
            treeGroup.rotation.y = t * 0.15;
            reflection.rotation.y = t * 0.15; 
            
            starMat.size = 25 + Math.sin(t*3)*5;
            outerMat.size = 1.0 + Math.sin(t*5)*0.2;

            const sPos = snowSystem.geometry.attributes.position.array;
            for(let i=1; i<sPos.length; i+=3) {
                sPos[i] -= snowVel[(i-1)/3];
                if(sPos[i] < -50) sPos[i] = 50;
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
            snowSystem.rotation.y = t * 0.05;

            camera.position.x += (mouseX - camera.position.x)*0.05;
            camera.position.y += (-mouseY + 20 - camera.position.y)*0.05;
            camera.lookAt(0,0,0);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>

</html>
